<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CashFlow 资金报表</title>
<script src="echarts.min.js"></script>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --gold: #e3b341; --blue: #58a6ff; --green: #3fb950; --red: #f85149; --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 24px; }
  .header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .header h1 { font-size: 22px; }
  .header .sub { color: var(--muted); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; }
  .card .delta { font-size: 12px; margin-top: 4px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 7px 16px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: var(--panel); font-size: 14px; color: var(--muted); }
  .tab.active { color: #fff; border-color: var(--gold); background: #1f2430; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .panel h3 { font-size: 14px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
  .chart { width: 100%; height: 380px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 14px; }
  .grid .chart { height: 300px; }
  .note { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.7; }
</style>
</head>
<body>

<div class="header">
  <h1>CashFlow 资金报表</h1>
  <div class="sub" id="sub-updated">数据更新：— · 每日自动发布</div>
</div>

<div class="cards" id="cards"></div>

<div class="tabs" id="tabs">
  <div class="tab active" data-tab="overview">总览</div>

  <div class="tab" data-tab="symbols">品种盈亏</div>
</div>

<div id="page-overview">
  <div class="panel">
    <h3>总资产资金曲线（USD 口径）</h3>
    <div class="chart" id="chart-overview"></div>
  </div>
</div>

<div id="page-usd" style="display:none">
  <div class="panel">
    <h3>USD 侧资金曲线</h3>
    <div class="chart" id="chart-usd"></div>
  </div>
</div>

<div id="page-aud" style="display:none">
  <div class="panel">
    <h3>AUD 侧资金曲线</h3>
    <div class="chart" id="chart-aud"></div>
  </div>
</div>

<div id="page-symbols" style="display:none">

</div>

// ============ 数据准备（days / symbols 均按日期升序） ============
const days = DATA.days || [];          // 每日资产：usd 恒有值，aud/rate 可能为 null（该日 AUD 侧缺失）
const symbols = DATA.symbols || [];    // 每日各品种累计盈亏，品种 key 只有开启的品种
const dates = days.map(d => d.date);   // 总览/USD/AUD 图共用的日期 x 轴
const totalArr = days.map(d => d.total);   // 总资产（USD 口径，aud 缺失日 total=usd）
const usdArr = days.map(d => d.usd);       // USD 侧余额
const audArr = days.map(d => d.aud);       // AUD 侧余额（原币，null 处曲线自然断点）

const audUsdArr = days.map(d => (d.aud == null || d.rate == null) ? null : +(d.aud * d.rate).toFixed(2));
// 副标题数据更新时间
document.getElementById("sub-updated").textContent = "数据更新：" + (DATA.updatedUtc || "—") + " · 每日自动发布";

// ============ 统计卡片 ============
function pct(a, b) { return b ? ((a - b) / b * 100) : 0; }
// 金额格式化：null（缺失或历史不足）统一显示 —
function fmtUsd(v) { return v == null ? "—" : "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2}); }
function fmtAud(v) { return v == null ? "—" : "A$" + v.toLocaleString("en-AU", {minimumFractionDigits: 2}); }
// 百分比格式化：null → —
function fmtPct(v) { return v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%"; }
// deltaPct 传 null 时不渲染百分比小字
function fmtCard(label, val, deltaPct) {
  const has = deltaPct != null;
  const cls = has && deltaPct >= 0 ? "up" : "down";
  const delta = has ? `<div class="delta ${cls}">${deltaPct >= 0 ? "+" : ""}${deltaPct.toFixed(2)}%</div>` : "";
  return `<div class="card"><div class="label">${label}</div>
    <div class="value">${val}</div>${delta}</div>`;
}
{
  const n = days.length;
  const last = n ? totalArr[n - 1] : null;
  const lastUsd = n ? usdArr[n - 1] : null, firstUsd = n ? usdArr[0] : null;
  const lastAud = n ? audArr[n - 1] : null, firstAud = n ? audArr[0] : null;
  // 区间收益率：近 k 日 = 最新总资产与 n-1-k 日前总资产之比；历史不足（n-1-k<0）返回 null
  const r = k => (n - 1 - k >= 0) ? pct(last, totalArr[n - 1 - k]) : null;
  const pnl = n ? last - totalArr[0] : null;   // 全部盈亏 = 最新总资产 − 首日总资产
  document.getElementById("cards").innerHTML =
    fmtCard("总资产 (USD)", fmtUsd(last), n ? pct(last, totalArr[0]) : null) +
    fmtCard("USD 侧", fmtUsd(lastUsd), n ? pct(lastUsd, firstUsd) : null) +
    fmtCard("AUD 侧", fmtAud(lastAud), lastAud != null && firstAud != null ? pct(lastAud, firstAud) : null) +
    fmtCard("近 1 日", fmtPct(r(1)), r(1)) +
    fmtCard("近 7 日", fmtPct(r(7)), r(7)) +
    fmtCard("近 30 日", fmtPct(r(30)), r(30)) +
    fmtCard("近 90 日", fmtPct(r(90)), r(90)) +
    fmtCard("近半年", fmtPct(r(183)), r(183)) +
    fmtCard("近一年", fmtPct(r(365)), r(365)) +
    fmtCard("全部盈亏 (USD)", pnl == null ? "—" : (pnl >= 0 ? "+" : "-") + "$" + Math.abs(pnl).toLocaleString("en-US", {minimumFractionDigits: 2}), n ? pct(last, totalArr[0]) : null);
}

// ============ 图表 ============
const AXIS = {
  animation: false,  // 静态报表不需要入场动画，避免首次渲染空白
  xAxis: { type: "category", data: dates, axisLine: { lineStyle: { color: "#30363d" } },
           axisLabel: { color: "#8b949e" } },
  grid: { left: 85, right: 20, top: 20, bottom: 60 },
  // 时间拉杆：默认最左=全部历史，拖到最右=聚焦近期；滚轮/触控板也可缩放
  dataZoom: [
    { type: "slider", height: 18, bottom: 8,
      borderColor: "#30363d", backgroundColor: "transparent",
      fillerColor: "rgba(227,179,65,0.18)",
      handleStyle: { color: "#e3b341", borderColor: "#e3b341" },
      moveHandleStyle: { color: "#484f58" },
      emphasis: { handleStyle: { color: "#f2cc60" } },
      textStyle: { color: "#8b949e", fontSize: 10 },
      dataBackground: { lineStyle: { color: "#30363d" }, areaStyle: { color: "#21262d" } },
      selectedDataBackground: { lineStyle: { color: "#e3b341" }, areaStyle: { color: "rgba(227,179,65,0.15)" } } },
    { type: "inside" },
  ],
  tooltip: { trigger: "axis", backgroundColor: "#161b22", borderColor: "#30363d", textStyle: { color: "#e6edf3" } },
};
function lineSeries(name, data, color, extra = {}) {
  // 历史不足两天（如品种上线首日）时显示数据点标记，否则单点曲线不可见
  const singlePt = data.filter(v => v !== null && v !== undefined).length <= 1;
  return Object.assign({
    name, type: "line", data, smooth: true, showSymbol: singlePt, symbolSize: singlePt ? 10 : 4,
    lineStyle: { color, width: 2 },
    areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
      { offset: 0, color: color + "55" }, { offset: 1, color: color + "05" }]) },
    itemStyle: { color },
  }, extra);
}
function mkChart(id, option) {
  const c = echarts.init(document.getElementById(id), null, { renderer: "canvas" });
  c.setOption(option);
  return c;
}
const charts = {};
function renderActive(page) {
  if (page === "overview" && !charts.overview) {
    charts.overview = mkChart("chart-overview", Object.assign({}, AXIS, {
      yAxis: { scale: true, axisLabel: { color: "#8b949e", formatter: v => "$" + v.toLocaleString() }, splitLine: { lineStyle: { color: "#21262d" } } },
      legend: { textStyle: { color: "#8b949e" }, top: 0 },
      series: [
        lineSeries("总资产 USD", totalArr, "#e3b341"),
        lineSeries("USD 侧", usdArr, "#58a6ff"),
        lineSeries("AUD 侧 (折USD)", audUsdArr, "#3fb950"),
      ],
    }));
  }
  if (page === "usd" && !charts.usd) {
    charts.usd = mkChart("chart-usd", Object.assign({}, AXIS, {
      yAxis: { scale: true, axisLabel: { color: "#8b949e", formatter: v => "$" + v.toLocaleString() }, splitLine: { lineStyle: { color: "#21262d" } } },
      series: [lineSeries("USD", usdArr, "#58a6ff")],
    }));
  }
  if (page === "aud" && !charts.aud) {
    charts.aud = mkChart("chart-aud", Object.assign({}, AXIS, {
      yAxis: { scale: true, axisLabel: { color: "#8b949e", formatter: v => "A$" + v.toLocaleString() }, splitLine: { lineStyle: { color: "#21262d" } } },
      series: [lineSeries("AUD", audArr, "#3fb950")],
    }));
  }
  if (page === "symbols" && !charts.symbols) {
    charts.symbols = {};
    // 品种顺序与币种取自 symbolMeta（保持注入时的 key 顺序）
    const symNames = Object.keys(DATA.symbolMeta || {});
    const symDates = symbols.map(s => s.date);    // 品种图专用日期 x 轴
    const SYM_COLORS = ["#58a6ff", "#e3b341", "#f0883e", "#ff7b72"];   // 品种色板，超出四色后循环
    if (!symNames.length || !symDates.length) {
      // 无品种或无数据：空提示
      document.getElementById("sym-grid").innerHTML =
        '<div class="panel" style="color:var(--muted);text-align:center;padding:32px 16px">暂无品种盈亏数据</div>';
    } else {
      symNames.forEach((name, i) => {
        const cur = DATA.symbolMeta[name] || "";
        const color = SYM_COLORS[i % SYM_COLORS.length];
        const pnl = symbols.map(s => s[name] ?? null);   // 缺失日/缺 key 均为 null 断点
        // 最新非空值决定曲线颜色：≥0 绿 / <0 红
        let lastVal = null;
        for (let j = pnl.length - 1; j >= 0; j--) { if (pnl[j] != null) { lastVal = pnl[j]; break; } }
        const div = document.createElement("div");
        div.className = "panel";
        div.innerHTML = `<h3><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${color};margin-right:6px"></span>${name} · 累计盈亏 (${cur})</h3><div class="chart" id="sym-${i}"></div>`;
        document.getElementById("sym-grid").appendChild(div);
        charts.symbols[i] = mkChart("sym-" + i, Object.assign({}, AXIS, {
          xAxis: Object.assign({}, AXIS.xAxis, { data: symDates }),   // 覆盖共用 x 轴的日期数据
          yAxis: { axisLabel: { color: "#8b949e", formatter: v => cur + "$" + v.toLocaleString() }, splitLine: { lineStyle: { color: "#21262d" } } },
          series: [lineSeries(name, pnl, (lastVal == null || lastVal >= 0) ? "#3fb950" : "#f85149")],
        }));
      });
    }
  }
  Object.values(charts).forEach(c => Array.isArray(c) || c.resize && c.resize());
  if (charts.symbols) Object.values(charts.symbols).forEach(c => c.resize());
}
// Tab 切换
document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (!t) return;
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  ["overview", "usd", "aud", "symbols"].forEach(p => {
    document.getElementById("page-" + p).style.display = (p === t.dataset.tab) ? "" : "none";
  });
  renderActive(t.dataset.tab);
});
window.addEventListener("resize", () => {
  Object.values(charts).forEach(c => Array.isArray(c) || c.resize && c.resize());
  if (charts.symbols) Object.values(charts.symbols).forEach(c => c.resize());
});
renderActive("overview");
